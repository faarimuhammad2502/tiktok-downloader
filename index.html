<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Video & Audio Downloader Ultra</title>
  
  <!-- Logo Favicon "DT" di Tab Browser -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='28' fill='%23121212'/><text x='50%' y='68%' font-size='52' font-weight='900' font-family='Arial, sans-serif' text-anchor='middle' fill='%23FF0050'>D<tspan fill='%2300F2FE'>T</tspan></text></svg>">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #ffffff;
      background: radial-gradient(circle at 10% 10%, #1a0033 0%, #080811 50%, #001a2e 100%);
      background-attachment: fixed;
      position: relative;
      overflow-x: hidden;
    }

    body::after {
      content: "";
      position: absolute;
      width: 380px;
      height: 380px;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.25), rgba(255, 0, 80, 0.25));
      filter: blur(100px);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    .wrapper { position: relative; z-index: 2; width: 100%; max-width: 520px; }

    .card {
      background: rgba(18, 20, 29, 0.85);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 30px;
      border-radius: 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      text-align: center;
    }

    .badge {
      display: inline-flex;
      padding: 6px 16px;
      background: rgba(0, 242, 254, 0.12);
      color: #00F2FE;
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 50px;
      font-size: 11px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .brand {
      font-size: 30px;
      font-weight: 900;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #00F2FE, #FF0050);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle { color: #a0a5ba; font-size: 13px; margin-bottom: 25px; }

    /* Input Wrapper Responsive */
    .input-wrapper {
      display: flex;
      flex-wrap: wrap; /* Tombol otomatis turun di layar kecil */
      gap: 8px;
      background: rgba(10, 11, 16, 0.85);
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
    }

    input {
      flex: 1;
      min-width: 150px;
      padding: 12px 10px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .btn-action-toggle, .btn-submit {
      padding: 12px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      transition: all 0.3s;
    }

    .btn-action-toggle { background: rgba(255, 255, 255, 0.08); color: #00F2FE; }
    .btn-action-toggle.is-cancel { background: rgba(255, 0, 80, 0.15); color: #FF0050; }
    
    .btn-submit {
      flex-grow: 1;
      background: linear-gradient(135deg, #FF0050, #7F00FF);
      color: white;
    }

    .loader {
      display: none;
      margin: 20px auto;
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #00F2FE;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    #resultCard { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .btn-dl { padding: 12px; border-radius: 12px; text-decoration: none; color: white; font-weight: 700; display: block; margin-bottom: 10px; }
    .btn-hd { background: #10B981; }
    .btn-sd { background: #3B82F6; }
    .btn-audio { background: #8B5CF6; }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="card">
      <span class="badge">⚡ ULTRA FAST</span>
      <div class="brand">TikTok Downloader</div>
      <p class="subtitle">Download Video & Musik Tanpa Watermark</p>

      <div class="input-wrapper">
        <input type="text" id="tiktokUrl" placeholder="Tempel link TikTok..." oninput="updateActionBtn()">
        <button type="button" class="btn-action-toggle" id="btnToggle" onclick="handleToggleAction()">
          <span id="btnIcon">📋</span> <span id="btnText">Tempel</span>
        </button>
        <button class="btn-submit" onclick="fetchVideo()">Proses</button>
      </div>

      <div id="loader" class="loader"></div>
      <p id="loadingMsg" style="display:none; font-size: 12px; color: #a0a5ba; margin-top: 10px;"></p>

      <div id="resultCard">
        <p style="margin-bottom: 15px; color: #00F2FE;">✨ Video siap diunduh!</p>
        <a id="btnHd" class="btn-dl btn-hd" href="#" target="_blank" download>🚀 HD Video</a>
        <a id="btnSd" class="btn-dl btn-sd" href="#" target="_blank" download>📹 SD Video</a>
        <a id="btnAudio" class="btn-dl btn-audio" href="#" target="_blank" download>🎵 Audio MP3</a>
      </div>
    </div>
  </div>

  <script>
    async function handleToggleAction() {
      const input = document.getElementById('tiktokUrl');
      if (input.value.length > 0) {
        input.value = '';
        document.getElementById('resultCard').style.display = 'none';
        updateActionBtn();
      } else {
        try {
          const text = await navigator.clipboard.readText();
          if (text) { input.value = text; updateActionBtn(); }
        } catch (err) { alert('Gunakan tempel manual.'); }
      }
    }

    function updateActionBtn() {
      const input = document.getElementById('tiktokUrl');
      const btn = document.getElementById('btnToggle');
      if (input.value.length > 0) {
        btn.classList.add('is-cancel');
        btn.innerHTML = '✖ Batal';
      } else {
        btn.classList.remove('is-cancel');
        btn.innerHTML = '📋 Tempel';
      }
    }

    async function fetchVideo() {
      const videoUrl = document.getElementById('tiktokUrl').value.trim();
      const loader = document.getElementById('loader');
      const msg = document.getElementById('loadingMsg');
      const resultCard = document.getElementById('resultCard');

      if (!videoUrl) return alert('Tempel link dulu!');
      
      loader.style.display = 'block';
      msg.style.display = 'block';
      msg.textContent = 'Menghubungkan ke server...';
      resultCard.style.display = 'none';

      setTimeout(() => msg.textContent = 'Memproses video...', 1500);

      try {
        const res = await fetch(`https://tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com/index?url=${encodeURIComponent(videoUrl)}`, {
          method: 'GET',
          headers: {
            'x-rapidapi-key': 'e4c7b565bcmsh136e87b8aa9ba7fp1f7ff1jsn80a4b11ce456',
            'x-rapidapi-host': 'tiktok-downloader-download-tiktok-videos-without-watermark.p.rapidapi.com'
          }
        });
        const data = await res.json();
        loader.style.display = 'none'; msg.style.display = 'none';

        if (data?.video?.length > 0) {
          document.getElementById('btnHd').href = data.video[1] || data.video[0];
          document.getElementById('btnSd').href = data.video[0];
          if(data.music) document.getElementById('btnAudio').href = data.music[0];
          resultCard.style.display = 'block';
        } else { alert('Gagal memproses link.'); }
      } catch (err) { loader.style.display = 'none'; msg.style.display = 'none'; alert('Terjadi kesalahan.'); }
    }
  </script>
</body>
</html>
